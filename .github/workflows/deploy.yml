name: Build and Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore EbayClone.sln
      
    - name: Build
      run: dotnet build EbayClone.sln --no-restore
      
    - name: Test
      run: dotnet test EbayClone.sln --no-build --verbosity normal
      
    - name: Docker Build (API)
      run: docker build -t ebayclone-api -f EbayClone.API/Dockerfile .
      
    - name: Docker Build (MVC)
      run: docker build -t ebayclone-mvc -f EbayClone.MVC/Dockerfile .
